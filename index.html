
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 20px auto;
}
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.active {
  color: red;
  font-weight: bold;
}
.notice {
  color: green;
  font-weight: bold;
}
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle"> Admin modus
</label>

<div id="adminControls" style="display:none;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo" class="active"></p>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
});

const db = getFirestore(app);
const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let slots = 1;
let isAdmin = false;
let wasTurn = false;

//////////////////////////////
// 🔔 NOTIFICATIE
//////////////////////////////

const sound = new Audio(
  "https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3"
);

let soundEnabled = false;

document.addEventListener("click", () => {
  if (!soundEnabled) {
    sound.play().then(() => {
      sound.pause();
      soundEnabled = true;
    }).catch(()=>{});
  }
});

if ("Notification" in window) {
  Notification.requestPermission();
}

function notify() {
  if (Notification.permission === "granted") {
    new Notification("👉 JIJ BENT AAN DE BEURT!");
  }
  if (soundEnabled) {
    sound.currentTime = 0;
    sound.play();
  }
}

//////////////////////////////
// CLIENT ID
//////////////////////////////

let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36);
  localStorage.setItem("clientId", clientId);
}

//////////////////////////////
// ADMIN
//////////////////////////////

const adminToggle = document.getElementById("adminToggle");
const adminControls = document.getElementById("adminControls");
const increaseSlot = document.getElementById("increaseSlot");
const decreaseSlot = document.getElementById("decreaseSlot");
const slotCount = document.getElementById("slotCount");

adminToggle.onchange = () => {
  if (prompt("Wachtwoord") === "admin123") {
    isAdmin = true;
    adminControls.style.display = "block";
  } else {
    adminToggle.checked = false;
  }
};

increaseSlot.onclick = () => setDoc(configDoc, { slots: slots + 1 });

decreaseSlot.onclick = () => {
  if (slots > 1) setDoc(configDoc, { slots: slots - 1 });
};

onSnapshot(configDoc, snap => {
  if (snap.exists()) {
    slots = snap.data().slots;
    slotCount.textContent = "Slots: " + slots;

    if (lastItems.length) {
      render(lastItems, lastMe);
    }
  }
});

//////////////////////////////
// 🔼🔽 STABIELE VERPLAATSING
//////////////////////////////

async function moveUp(item, items, i) {
  if (i === 0) return;

  const prev = items[i - 1];
  const newPos = (item.position + prev.position) / 2;

  await updateDoc(doc(db, "queue", item.id), {
    position: newPos
  });
}

async function moveDown(item, items, i) {
  if (i === items.length - 1) return;

  const next = items[i + 1];
  const newPos = (item.position + next.position) / 2;

  await updateDoc(doc(db, "queue", item.id), {
    position: newPos
  });
}

//////////////////////////////
// JOIN / LEAVE
//////////////////////////////

const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");

joinBtn.onclick = async () => {
  if (lastItems.find(i => i.clientId === clientId)) {
    return alert("Je zit al in wachtrij");
  }

  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now()
  });
};

leaveBtn.onclick = () => {
  if (currentDocId) deleteDoc(doc(db, "queue", currentDocId));
};

//////////////////////////////
// REALTIME
//////////////////////////////

onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const item = { id: d.id, ...d.data() };
    items.push(item);

    if (item.clientId === clientId) {
      currentDocId = d.id;
      me = item;
    }
  });

  lastItems = items;
  lastMe = me;

  render(items, me);
});

//////////////////////////////
// RENDER
//////////////////////////////

const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const notice = document.getElementById("notice");
const activeInfo = document.getElementById("activeInfo");

function render(items, me) {

  queueList.innerHTML = "";
  notice.textContent = "";

  const activeCount = items.filter(i => i.status === "active").length;

  items.forEach((item, i) => {

    const li = document.createElement("li");

    li.textContent = `${i + 1}. ${item.name}`;

    if (item.status === "active") {
      li.textContent += " (bezig)";
      li.classList.add("active");
    }

    if (item.id === currentDocId) li.classList.add("me");

    // USER
    if (item.id === currentDocId) {

      const canStart =
        i < slots &&
        item.status !== "active" &&
        activeCount < slots;

      if (canStart) {
        const startBtn = document.createElement("button");
        startBtn.textContent = "Start";
        startBtn.onclick = () =>
          updateDoc(doc(db, "queue", item.id), {
            status: "active"
          });
        li.appendChild(startBtn);
      }

      const stopBtn = document.createElement("button");
      stopBtn.textContent = "Stop";
      stopBtn.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));
      li.appendChild(stopBtn);

      const laterBtn = document.createElement("button");
      laterBtn.textContent = "Later";
      laterBtn.onclick = () => moveDown(item, items, i);
      li.appendChild(laterBtn);
    }

    // ADMIN
    if (isAdmin) {

      const upBtn = document.createElement("button");
      upBtn.textContent = "↑";
      upBtn.onclick = () => moveUp(item, items, i);

      const downBtn = document.createElement("button");
      downBtn.textContent = "↓";
      downBtn.onclick = () => moveDown(item, items, i);

      const delBtn = document.createElement("button");
      delBtn.textContent = "X";
      delBtn.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));

      li.appendChild(upBtn);
      li.appendChild(downBtn);
      li.appendChild(delBtn);
    }

    queueList.appendChild(li);
  });

  activeInfo.textContent =
    activeCount ? `🔥 ${activeCount}/${slots} bezig` : "";

  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    wasTurn = false;
    return;
  }

  const idx = items.findIndex(i => i.id === me.id);

  const isTurn =
    idx < slots &&
    me.status !== "active" &&
    activeCount < slots;

  if (isTurn && !wasTurn) {
    notify();
    notice.textContent = "👉 JE BENT AAN DE BEURT!";
  }

  wasTurn = isTurn;

  yourStatus.textContent = "Positie: " + (idx + 1);
}

</script>

</body>
</html>
