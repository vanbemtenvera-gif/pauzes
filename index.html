
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: sans-serif;
}

/* ✅ achtergrond */
#bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
}

/* ✅ overlay */
#overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(255,255,255,0.75);
}

/* origineel */
body {
  max-width: 700px;
  margin: 20px auto;
}

li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
}
button { margin-left: 5px; }
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none;margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 2</span>
  <button id="increaseSlot">+</button>
</div>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<!-- ✅ achtergrond -->
<script>
const backgrounds = [
  "https://picsum.photos/id/1015/1920/1080",
  "https://picsum.photos/id/1016/1920/1080",
  "https://picsum.photos/id/1018/1920/1080",
  "https://picsum.photos/id/1020/1920/1080",
  "https://picsum.photos/id/1024/1920/1080",
  "https://picsum.photos/id/1035/1920/1080"
];

(function () {
  const today = new Date().toISOString().split("T")[0];
  let saved = JSON.parse(localStorage.getItem("bgData") || "null");

  if (!saved || saved.date !== today) {
    saved = {
      date: today,
      index: Math.floor(Math.random() * backgrounds.length)
    };
    localStorage.setItem("bgData", JSON.stringify(saved));
  }

  document.getElementById("bg").style.backgroundImage =
    `url('${backgrounds[saved.index]}')`;
})();
</script>

<!-- ✅ VOLLEDIG SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let isAdmin = false;
let notified = false;
let slots = 2;

/* AUDIO */
const alertSound = new Audio(
  "https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3"
);

alertSound.volume = 1.0;
let soundEnabled = false;

document.addEventListener("click", () => {
  if (!soundEnabled) {
    alertSound.play().then(() => {
      alertSound.pause();
      alertSound.currentTime = 0;
      soundEnabled = true;
    }).catch(()=>{});
  }
});

/* NOTIFICATIE */
if ("Notification" in window) {
  Notification.requestPermission().catch(()=>{});
}

function showNotification() {
  if (Notification.permission === "granted") {
    new Notification("👉 JOUW BEURT!", {
      body: "Je bent aan de beurt!"
    });
  }
}

/* CLIENT ID */
let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

/* UI */
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");

/* ✅ BELANGRIJK: JOIN WERKT NU */
joinBtn.addEventListener("click", async () => {

  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now()
  });

});
</script>

</body>
</html>
