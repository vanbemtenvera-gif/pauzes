
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 20px auto;
}
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
}
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

//////////////////////////////
// 🔥 FIREBASE CONFIG
//////////////////////////////

const firebaseConfig = {
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");

//////////////////////////////
// STATE
//////////////////////////////

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let isAdmin = false;
let notified = false;

//////////////////////////////
// CLIENT ID
//////////////////////////////

let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

//////////////////////////////
// UI
//////////////////////////////

const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const notice = document.getElementById("notice");
const adminToggle = document.getElementById("adminToggle");

//////////////////////////////
// HELPERS
//////////////////////////////

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

//////////////////////////////
// ADMIN LOGIN
//////////////////////////////

const ADMIN_PASSWORD = "geheim123";

adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Admin wachtwoord:");
    if (input === ADMIN_PASSWORD) {
      isAdmin = true;
      console.log("✅ Admin ingelogd");
    } else {
      adminToggle.checked = false;
    }
  } else {
    isAdmin = false;
  }
});

//////////////////////////////
// JOIN
//////////////////////////////

joinBtn.addEventListener("click", async () => {

  // ✅ voorkom dubbele join
  const exists = lastItems.find(i => i.clientId === clientId);
  if (exists) {
    alert("Je zit al in de wachtrij");
    return;
  }

  try {
    await addDoc(queueCol, {
      clientId,
      name: nameInput.value || "Anoniem",
      position: Date.now(),
      status: "waiting",
      joinedAt: Date.now()
    });

    console.log("✅ Joined");

  } catch (e) {
    console.error("❌ Join error:", e);
    alert(e.message);
  }
});

//////////////////////////////
// LEAVE
//////////////////////////////

leaveBtn.addEventListener("click", async () => {
  if (!currentDocId) return;

  try {
    await deleteDoc(doc(db, "queue", currentDocId));
    console.log("✅ Left queue");
  } catch (e) {
    console.error(e);
  }
});

//////////////////////////////
// REALTIME LISTENER
//////////////////////////////

onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const item = { id: d.id, ...d.data() };
    items.push(item);

    if (item.clientId === clientId) {
      currentDocId = d.id;
      me = item;
    }
  });

  lastItems = items;
  lastMe = me;

  render(items, me);
});

//////////////////////////////
// RENDER
//////////////////////////////

function render(items, me) {

  queueList.innerHTML = "";
  notice.textContent = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");

    const elapsed = item.joinedAt
      ? Date.now() - item.joinedAt
      : 0;

    li.textContent = `${i + 1}. ${item.name} (${formatTime(elapsed)})`;

    if (item.id === currentDocId) li.classList.add("me");

    if (item.status === "active") {
      li.textContent += " (bezig)";
    }

    //////////////////////
    // USER ACTIONS
    //////////////////////

    if (item.id === currentDocId) {

      // START
      if (i <= 1) {
        const startBtn = document.createElement("button");
        startBtn.textContent = "Start";

        startBtn.onclick = async () => {
          await updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now()
          });
        };

        li.appendChild(startBtn);
      }

      // STOP
      const stopBtn = document.createElement("button");
      stopBtn.textContent = "Stop";

      stopBtn.onclick = async () => {
        await deleteDoc(doc(db, "queue", item.id));
      };

      li.appendChild(stopBtn);

      // LATER
      const laterBtn = document.createElement("button");
      laterBtn.textContent = "Later";

      if (i < items.length - 1 && item.status !== "active") {
        laterBtn.onclick = () => moveBack(item, items, i);
      } else {
        laterBtn.disabled = true;
      }

      li.appendChild(laterBtn);
    }

    //////////////////////
    // ADMIN DELETE
    //////////////////////

    if (isAdmin) {
      const delBtn = document.createElement("button");
      delBtn.textContent = "X";

      delBtn.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));

      li.appendChild(delBtn);
    }

    queueList.appendChild(li);
  });

  //////////////////////
  // STATUS
  //////////////////////

  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notified = false;
    return;
  }

  const idx = items.findIndex(x => x.id === me.id);
  yourStatus.textContent = `Positie: ${idx + 1}`;

  const isTop = idx <= 1;

  if (isTop && me.status !== "active" && !notified) {
    notice.textContent = "👉 JE BENT AAN DE BEURT!";
    notified = true;
  }

  if (!isTop) {
    notified = false;
  }
}

//////////////////////////////
// MOVE BACK
//////////////////////////////

async function moveBack(item, items, index) {
  try {
    const next = items[index + 1];

    await updateDoc(doc(db, "queue", item.id), {
      position: next.position + 1
    });

  } catch (e) {
    console.error("❌ Move error:", e);
  }
}

//////////////////////////////
// TIMER REFRESH
//////////////////////////////

setInterval(() => {
  if (lastItems.length > 0) {
    render(lastItems, lastMe);
  }
}, 1000);

</script>

</body>
</html>
