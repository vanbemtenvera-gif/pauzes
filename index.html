
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>

/* ✅ FULLSCREEN */
html, body {
  height: 100%;
  margin: 0;
}

/* ✅ BACKGROUND + TYPO */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  /* ✅ subtiele leesbaarheid */
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

/* ✅ PROFESSIONELE OVERLAY (licht) */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: linear-gradient(
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.45)
  );

  z-index: -1;
}

/* ✅ CONTAINER */
.container {
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
}

/* ✅ TITEL */
h1 {
  font-size: 28px;
  font-weight: 600;
}

/* ✅ UI ELEMENTEN */
li { margin: 8px 0; }

.me {
  background: rgba(255,255,255,0.12);
  padding: 5px;
  border-radius: 8px;
}

.active {
  color: #ff8a80;
  font-weight: bold;
}

.notice {
  color: #69f0ae;
  font-weight: bold;
}

/* ✅ INPUT */
input {
  padding: 8px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* ✅ BUTTONS */
button {
  margin-left: 6px;
  padding: 6px 10px;

  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 8px;

  color: white;
  cursor: pointer;

  backdrop-filter: blur(4px);
}

button:hover {
  background: rgba(255,255,255,0.3);
}

/* ✅ STRUCTUUR */
ul, p, input, button, h1, label, div {
  position: relative;
  z-index: 1;
}

</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none; margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo"></p>

<ul id="queueList"></ul>

<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<!-- ✅ PROFESSIONELE FOTO (HIGH QUALITY) -->
<script>
(function() {

  const day = new Date().getDate();

  // ✅ dag seed → elke dag andere foto
  const seed = "queue-app-" + day;

  // ✅ 4K kwaliteit (scherp op elk scherm)
  const imageUrl =
    `https://source.unsplash.com/2560x1440/?nature,landscape&${seed}`;

  document.body.style.backgroundImage = `url(${imageUrl})`;

})();
</script>

<!-- ✅ APP -->
<script type="module" src="app.js"></script>

</body>
</html>
