
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 0;

  background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb") no-repeat center center fixed;
  background-size: cover;
}

/* ✅ overlay */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  z-index: 0;
}

/* ✅ container boven overlay */
.container {
  position: relative;
  z-index: 1;

  max-width: 700px;
  margin: 40px auto;

  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);

  padding: 25px;
  border-radius: 20px;

  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

h1 {
  text-align: center;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-right: 10px;
}

button {
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  background: #1976d2;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #145ca8;
}

li {
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.me {
  background: #e3f2fd;
  border: 2px solid #1976d2;
}

.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
  text-align: center;
}

.controls button {
  margin-left: 5px;
}

#yourStatus {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin / Superadmin
</label>

<div id="slotControls" style="display:none; margin-top:10px;">
  <button id="minusSlot">-</button>
  <span id="slotInfo">Slots: 2</span>
  <button id="plusSlot">+</button>
</div>

<ul id="queueList"></ul>

<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

const ADMIN_PASSWORD = "admin123";
const SUPERADMIN_PASSWORD = "super123";

let isAdmin = false;
let isSuperAdmin = false;
let maxSlots = 2;
let lastWasTop = false;

// 🔔 geluid
const beep = new Audio("https://archive.org/download/iphone_notification/iphone_notification.mp3");

if ("Notification" in window) {
  Notification.requestPermission().catch(() => {});
}

function showNotification() {
  beep.currentTime = 0;
  beep.play().catch(() => {});

  if (Notification.permission === "granted") {
    new Notification("👉 JOUW BEURT!", {
      body: "Je mag starten!"
    });
  }

  const original = document.title;
  const interval = setInterval(() => {
    document.title =
      document.title === "👉 JOUW BEURT!" ? original : "👉 JOUW BEURT!";
  }, 1000);

  setTimeout(() => {
    clearInterval(interval);
    document.title = original;
  }, 15000);
}

// client id
let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

// UI
const nameInput = document.getElementById("nameInput");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const adminToggle = document.getElementById("adminToggle");
const notice = document.getElementById("notice");
const slotControls = document.getElementById("slotControls");
const slotInfo = document.getElementById("slotInfo");

// slots realtime
onSnapshot(configDoc, async (snap) => {
  if (snap.exists()) {
    maxSlots = snap.data().maxSlots ?? 2;
  } else {
    await setDoc(configDoc, { maxSlots: 2 });
  }
  slotInfo.textContent = `Slots: ${maxSlots}`;
});

// admin login
adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Wachtwoord:");

    if (input === SUPERADMIN_PASSWORD) {
      isAdmin = true;
      isSuperAdmin = true;
      slotControls.style.display = "block";

    } else if (input === ADMIN_PASSWORD) {
      isAdmin = true;
      slotControls.style.display = "block";

    } else {
      alert("Fout ❌");
      adminToggle.checked = false;
    }
  } else {
    isAdmin = false;
    isSuperAdmin = false;
    slotControls.style.display = "none";
  }
});

// slots aanpassen
plusSlot.onclick = async () => {
  await setDoc(configDoc, { maxSlots: maxSlots + 1 }, { merge: true });
};

minusSlot.onclick = async () => {
  if (maxSlots > 1) {
    await setDoc(configDoc, { maxSlots: maxSlots - 1 }, { merge: true });
  }
};

// join
joinBtn.onclick = async () => {
  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now()
  });
};

// leave
leaveBtn.onclick = async () => {
  const me = document.querySelector(".me");
  if (!me) return;
  await deleteDoc(doc(db, "queue", me.dataset.id));
};

// realtime queue
onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const data = d.data();

    if (data.clientId === clientId) {
      me = { id: d.id, ...data };
    }

    items.push({ id: d.id, ...data });
  });

  render(items, me);
});

// render
function render(items, me) {

  queueList.innerHTML = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");
    li.dataset.id = item.id;

    if (item.id === me?.id) li.classList.add("me");

    const left = document.createElement("span");
    left.textContent = `${i+1}. ${item.name}`;

    const controls = document.createElement("div");
    controls.className = "controls";

    if (item.id === me?.id) {

      if (i < maxSlots) {
        const start = document.createElement("button");
        start.textContent = "Start";
        start.onclick = () =>
          updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now()
          });
        controls.appendChild(start);
      }

      const stop = document.createElement("button");
      stop.textContent = "Stop";
      stop.onclick = () => deleteDoc(doc(db, "queue", item.id));
      controls.appendChild(stop);
    }

    if (isAdmin) {
      const del = document.createElement("button");
      del.textContent = "❌";
      del.onclick = () => deleteDoc(doc(db, "queue", item.id));
      controls.appendChild(del);
    }

    li.appendChild(left);
    li.appendChild(controls);

    queueList.appendChild(li);
  });

  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    lastWasTop = false;
  } else {
    const idx = items.findIndex(x => x.id === me.id);
    yourStatus.textContent = `Positie: ${idx+1}`;

    const isTop = idx < maxSlots;

    notice.textContent = isTop ? "👉 JE BENT AAN DE BEURT!" : "";

    if (isTop && !lastWasTop && me.status !== "active") {
      showNotification();
    }

    lastWasTop = isTop;
  }
}
</script>

</body>
</html>
