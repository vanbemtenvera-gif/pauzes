
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>

/* ✅ FULLSCREEN */
html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: sans-serif;
  color: white;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  /* ✅ tekst leesbaarheid */
  text-shadow: 0 2px 6px rgba(0,0,0,0.85);
}

/* ✅ DYNAMISCHE OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: linear-gradient(
    rgba(var(--overlay-r,0), var(--overlay-g,0), var(--overlay-b,0), 0.30),
    rgba(var(--overlay-r,0), var(--overlay-g,0), var(--overlay-b,0), 0.60)
  );

  backdrop-filter: blur(3px);
  z-index: -1;
}

/* ✅ CONTENT CONTAINER */
.container {
  max-width: 700px;
  margin: 20px auto;
}

/* ✅ UI */
li { margin: 6px 0; }

.me {
  background: rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 4px;
}

.active {
  color: #ff8a80;
  font-weight: bold;
}

.notice {
  color: #69f0ae;
  font-weight: bold;
}

/* ✅ BUTTONS */
button {
  margin-left: 5px;
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: rgba(255,255,255,0.3);
}

/* ✅ INPUT */
input {
  padding: 6px;
  border-radius: 6px;
  border: none;
}

/* ✅ ALLES BOVEN OVERLAY */
ul, p, input, button, h1, label, div {
  position: relative;
  z-index: 1;
}

</style>

</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none; margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo"></p>

<ul id="queueList"></ul>

<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<!-- ✅ FOTO + DYNAMISCHE KLEUR -->
<script>
(async function() {

  const images = [
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    "https://images.unsplash.com/photo-1469474968028-56623f02e42e",
    "https://images.unsplash.com/photo-1501785888041-af3ef285b470",
    "https://images.unsplash.com/photo-1493244040629-496f6d136cc3"
  ];

  const day = new Date().getDate();

  // ✅ hogere kwaliteit afbeelding
  const imageUrl =
    images[day % images.length] +
    "?auto=format&fit=crop&w=2400&q=90";

  document.body.style.backgroundImage = `url(${imageUrl})`;

  // ✅ kleur extractie
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = imageUrl;

  img.onload = function() {

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 100;
    canvas.height = 100;

    ctx.drawImage(img, 0, 0, 100, 100);

    const data = ctx.getImageData(0, 0, 100, 100).data;

    let r = 0, g = 0, b = 0, count = 0;

    for (let i = 0; i < data.length; i += 4) {
      r += data[i];
      g += data[i + 1];
      b += data[i + 2];
      count++;
    }

    r = Math.floor(r / count);
    g = Math.floor(g / count);
    b = Math.floor(b / count);

    document.documentElement.style.setProperty('--overlay-r', r);
    document.documentElement.style.setProperty('--overlay-g', g);
    document.documentElement.style.setProperty('--overlay-b', b);
  };

})();
</script>

<!-- ✅ APP -->
<script type="module" src="app.js"></script>

</body>
</html>
