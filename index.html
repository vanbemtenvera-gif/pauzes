
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 20px auto;
}
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
}
.active {
  color: red;
  font-weight: bold;
}
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none;margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo" class="active"></p>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let slots = 1;
let isAdmin = false;
let notified = false;

//////////////////////////////
// AUDIO
//////////////////////////////

const alertSound = new Audio(
  "https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3"
);

let soundEnabled = false;
document.addEventListener("click", () => {
  if (!soundEnabled) {
    alertSound.play().then(() => {
      alertSound.pause();
      soundEnabled = true;
    }).catch(()=>{});
  }
});

if ("Notification" in window) {
  Notification.requestPermission().catch(()=>{});
}

function notifyUser() {
  if (Notification.permission === "granted") {
    new Notification("👉 JIJ BENT AAN DE BEURT!");
  }
  if (soundEnabled) {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
  }
}

//////////////////////////////
// CLIENT ID
//////////////////////////////

let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

//////////////////////////////
// UI
//////////////////////////////

const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const notice = document.getElementById("notice");
const activeInfo = document.getElementById("activeInfo");

const adminToggle = document.getElementById("adminToggle");
const adminControls = document.getElementById("adminControls");
const increaseSlot = document.getElementById("increaseSlot");
const decreaseSlot = document.getElementById("decreaseSlot");
const slotCount = document.getElementById("slotCount");

//////////////////////////////
// ADMIN
//////////////////////////////

adminToggle.onchange = () => {
  const pass = prompt("Admin wachtwoord:");
  if (pass === "admin123") {
    isAdmin = true;
    adminControls.style.display = "block";
  } else {
    adminToggle.checked = false;
  }
};

increaseSlot.onclick = async () => {
  if (!isAdmin) return;
  await setDoc(configDoc, { slots: slots + 1 });
};

decreaseSlot.onclick = async () => {
  if (!isAdmin || slots <= 1) return;
  await setDoc(configDoc, { slots: slots - 1 });
};

onSnapshot(configDoc, snap => {
  if (snap.exists()) {
    slots = snap.data().slots || 1;
  }
  slotCount.textContent = "Slots: " + slots;
});

//////////////////////////////
// HELPERS
//////////////////////////////

function formatTime(ms) {
  const t = Math.floor(ms / 1000);
  return `${Math.floor(t/60)}:${(t%60).toString().padStart(2,"0")}`;
}

async function moveUp(item, items, i) {
  if (i === 0) return;
  const prev = items[i - 1];
  await updateDoc(doc(db, "queue", item.id), {
    position: prev.position - 0.1
  });
}

async function moveDown(item, items, i) {
  if (i === items.length - 1) return;
  const next = items[i + 1];
  await updateDoc(doc(db, "queue", item.id), {
    position: next.position + 0.1
  });
}

//////////////////////////////
// JOIN / LEAVE
//////////////////////////////

joinBtn.onclick = async () => {
  if (lastItems.find(i => i.clientId === clientId)) {
    return alert("Je zit al in wachtrij");
  }

  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now()
  });
};

leaveBtn.onclick = async () => {
  if (!currentDocId) return;
  await deleteDoc(doc(db, "queue", currentDocId));
};

//////////////////////////////
// REALTIME
//////////////////////////////

onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const item = { id: d.id, ...d.data() };
    items.push(item);

    if (item.clientId === clientId) {
      currentDocId = d.id;
      me = item;
    }
  });

  lastItems = items;
  lastMe = me;

  render(items, me);
});

//////////////////////////////
// RENDER
//////////////////////////////

function render(items, me) {

  queueList.innerHTML = "";
  notice.textContent = "";

  let activeCount = items.filter(x => x.status === "active").length;

  items.forEach((item, i) => {

    const li = document.createElement("li");

    const elapsed = item.joinedAt
      ? Date.now() - item.joinedAt
      : 0;

    li.textContent = `${i + 1}. ${item.name} (${formatTime(elapsed)})`;

    if (item.status === "active") {
      li.textContent += " (bezig)";
      li.classList.add("active");
    }

    if (item.id === currentDocId) li.classList.add("me");

    // ✅ USER
    if (item.id === currentDocId) {

      // ✅ 🔥 FIX HIER
      if (i < slots && activeCount < slots && item.status !== "active") {
        const startBtn = document.createElement("button");
        startBtn.textContent = "Start";
        startBtn.onclick = async () => {
          await updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now()
          });
        };
        li.appendChild(startBtn);
      }

      const stopBtn = document.createElement("button");
      stopBtn.textContent = "Stop";
      stopBtn.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));
      li.appendChild(stopBtn);

      const laterBtn = document.createElement("button");
      laterBtn.textContent = "Later";
      laterBtn.onclick = () => moveDown(item, items, i);
      li.appendChild(laterBtn);
    }

    // ✅ ADMIN
    if (isAdmin) {

      const up = document.createElement("button");
      up.textContent = "↑";
      up.onclick = () => moveUp(item, items, i);
      if (i === 0) up.disabled = true;

      const down = document.createElement("button");
      down.textContent = "↓";
      down.onclick = () => moveDown(item, items, i);
      if (i === items.length - 1) down.disabled = true;

      const del = document.createElement("button");
      del.textContent = "X";
      del.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));

      li.appendChild(up);
      li.appendChild(down);
      li.appendChild(del);
    }

    queueList.appendChild(li);
  });

  activeInfo.textContent =
    activeCount ? `🔥 ${activeCount}/${slots} bezig` : "";

  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notified = false;
    return;
  }

  const idx = items.findIndex(x => x.id === me.id);
  yourStatus.textContent = `Positie: ${idx + 1}`;

  const isTurn = idx < slots && activeCount < slots;

  if (isTurn && !notified) {
    notice.textContent = "👉 JE BENT AAN DE BEURT!";
    notifyUser();
    notified = true;
  }

  if (!isTurn) notified = false;
}

</script>

</body>
</html>
