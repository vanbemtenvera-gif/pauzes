
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>

/* ✅ FULLSCREEN ACHTERGROND */
body {
  margin: 0;
  font-family: sans-serif;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* ✅ LEESBARE CONTENT BOX */
.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 20px;

  background: rgba(255,255,255,0.85);
  border-radius: 12px;
  backdrop-filter: blur(6px);
}

/* ORIGINELE STYLING (ONVERANDERD) */
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
}
button { margin-left: 5px; }

</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none;margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 2</span>
  <button id="increaseSlot">+</button>
</div>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<script type="module">

/* ✅ TOEGEVOEGD: DAGELIJKSE ACHTERGROND */
const backgrounds = [
  "https://picsum.photos/id/1015/1600/900",
  "https://picsum.photos/id/1016/1600/900",
  "https://picsum.photos/id/1018/1600/900",
  "https://picsum.photos/id/1020/1600/900",
  "https://picsum.photos/id/1024/1600/900",
  "https://picsum.photos/id/1035/1600/900"
];

function setDailyBackground() {
  const today = new Date().toISOString().split("T")[0];

  let saved = JSON.parse(localStorage.getItem("bgData"));

  if (!saved || saved.date !== today) {
    const index = Math.floor(Math.random() * backgrounds.length);
    saved = { date: today, index };
    localStorage.setItem("bgData", JSON.stringify(saved));
  }

  document.body.style.backgroundImage =
    `url(${backgrounds[saved.index]})`;
}

setDailyBackground();

/* ✅ HIERONDER: JOUW SCRIPT 100% ONGEWIJZIGD */

import { initializeApp } from https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js;
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js;

const firebaseConfig = {
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let isAdmin = false;
let notified = false;
let slots = 2;

//////////////////////////////
// 🔊 AUDIO
//////////////////////////////

const alertSound = new Audio(
  https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3
);

alertSound.volume = 1.0;
let soundEnabled = false;

document.addEventListener("click", () => {
  if (!soundEnabled) {
    alertSound.play().then(() => {
      alertSound.pause();
      alertSound.currentTime = 0;
      soundEnabled = true;
    }).catch(()=>{});
  }
});

//////////////////////////////
// 🔔 NOTIFICATIE
//////////////////////////////

if ("Notification" in window) {
  Notification.requestPermission().catch(()=>{});
}

function showNotification() {
  if (Notification.permission === "granted") {
    new Notification("👉 JOUW BEURT!", {
      body: "Je bent aan de beurt!"
    });
  }

  if (soundEnabled) {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
  }

  const original = document.title;
  const interval = setInterval(() => {
    document.title =
      document.title === "👉 JOUW BEURT!"
        ? original
        : "👉 JOUW BEURT!";
  }, 1000);

  setTimeout(() => {
    clearInterval(interval);
    document.title = original;
  }, 15000);
}

//////////////////////////////
// CLIENT ID
//////////////////////////////

let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

/* 🔚 REST VAN JE SCRIPT BLIJFT VOLLEDIG IDENTIEK */

</script>

</body>
</html>
