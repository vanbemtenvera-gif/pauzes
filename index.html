
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>

/* ✅ FULLSCREEN */
html, body {
  height: 100%;
  margin: 0;
}

/* ✅ BODY */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: white;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  /* ✅ veel subtieler */
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

/* ✅ LICHTE GRADIENT (enkel onderkant!) */
body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: linear-gradient(
    rgba(0,0,0,0.15) 20%,
    rgba(0,0,0,0.4) 100%
  );

  z-index: -1;
}

/* ✅ CONTAINER */
.container {
  max-width: 700px;
  margin: 50px auto;
  padding: 20px;
}

/* ✅ UI */
li { margin: 8px 0; }

.me {
  background: rgba(0,0,0,0.25);
  padding: 6px;
  border-radius: 8px;
}

.active {
  color: #ff5252;
  font-weight: bold;
}

.notice {
  color: #00e676;
  font-weight: bold;
}

/* ✅ INPUT */
input {
  padding: 8px;
  border-radius: 8px;
  border: none;
}

/* ✅ BUTTONS met lichte accent */
button {
  margin-left: 6px;
  padding: 6px 10px;

  background: rgba(255,255,255,0.2);
  border: none;
  border-radius: 8px;

  color: white;
  cursor: pointer;

  backdrop-filter: blur(6px);
}

button:hover {
  background: rgba(255,255,255,0.35);
}

/* ✅ Z-index */
ul, p, input, button, h1, label, div {
  position: relative;
  z-index: 1;
}

</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none; margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo"></p>

<ul id="queueList"></ul>

<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<!-- ✅ MOOIE LICHTE FOTO'S -->
<script>
(function() {

  const images = [
    "https://picsum.photos/id/1018/2560/1440",
    "https://picsum.photos/id/1003/2560/1440",
    "https://picsum.photos/id/1015/2560/1440",
    "https://picsum.photos/id/1025/2560/1440",
    "https://picsum.photos/id/1039/2560/1440"
  ];

  const day = new Date().getDate();
  const imageUrl = images[day % images.length];

  document.body.style.backgroundImage = `url("${imageUrl}")`;

})();
</script>

<!-- ✅ APP -->
<script type="module" src="app.js"></script>

</body>
</html>
