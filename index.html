
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice { color: green; font-weight: bold; }
.timer { margin-left: 10px; color: gray; font-size: 14px; }
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");

// ADMIN
const ADMIN_PASSWORD = "geheim123";
let isAdmin = false;
let notified = false;
let currentDocId = null;

// ✅ helper: tijd formatteren
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSec / 60);
  const seconds = totalSec % 60;

  return `${minutes}:${seconds.toString().padStart(2, "0")}`;
}

// CLIENT
let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

// UI
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const adminToggle = document.getElementById("adminToggle");
const notice = document.getElementById("notice");

// ✅ ADMIN LOGIN
adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Wachtwoord:");
    if (input === ADMIN_PASSWORD) {
      isAdmin = true;
    } else {
      adminToggle.checked = false;
    }
  } else {
    isAdmin = false;
  }
});

// ✅ JOIN (timer start hier)
joinBtn.addEventListener("click", async () => {
  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now() // ✅ timer start
  });
});

// ✅ LEAVE
leaveBtn.addEventListener("click", async () => {
  if (!currentDocId) return;
  await deleteDoc(doc(db, "queue", currentDocId));
});

// ✅ REALTIME LISTENER
onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const data = d.data();

    if (data.clientId === clientId) {
      currentDocId = d.id;
      me = { id: d.id, ...data };
    }

    items.push({ id: d.id, ...data });
  });

  render(items, me);
});

// ✅ RENDER LOOP
function render(items, me) {

  queueList.innerHTML = "";
  notice.textContent = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");

    // ✅ timer berekenen
    const elapsed = item.joinedAt ? Date.now() - item.joinedAt : 0;

    li.textContent = `${i + 1}. ${item.name}`;

    const timerSpan = document.createElement("span");
    timerSpan.className = "timer";
    timerSpan.textContent = ` (${formatTime(elapsed)})`;

    li.appendChild(timerSpan);

    if (item.id === currentDocId) {
      li.classList.add("me");
    }

    if (item.status === "active") {
      li.textContent += " (bezig)";
    }

    // ✅ ACTIES
    if (item.id === currentDocId) {

      if (i === 0 || i === 1) {

        const start = document.createElement("button");
        start.textContent = "Start";

        start.onclick = () =>
          updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now() // ✅ RESET TIMER
          });

        li.appendChild(start);
      }

      const stop = document.createElement("button");
      stop.textContent = "Stop";
      stop.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));

      li.appendChild(stop);

      const back = document.createElement("button");
      back.textContent = "Later";

      if (i < items.length - 1 && item.status !== "active") {
        back.onclick = () => moveBackOne(item, items, i);
      } else {
        back.disabled = true;
      }

      li.appendChild(back);
    }

    if (isAdmin) {
      const del = document.createElement("button");
      del.textContent = "X";
      del.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));
      li.appendChild(del);
    }

    queueList.appendChild(li);
  });

  // ✅ STATUS
  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notified = false;
  } else {
    const idx = items.findIndex(x => x.id === me.id);
    yourStatus.textContent = `Positie: ${idx + 1}`;

    if ((idx === 0 || idx === 1) && !notified) {
      notice.textContent = "👉 Je bent aan de beurt!";
      notified = true;
    }

    if (!(idx === 0 || idx === 1)) {
      notified = false;
    }
  }
}

// ✅ MOVE BACK
async function moveBackOne(item, items, index) {
  const nextItem = items[index + 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: nextItem.position + 1
  });
}

// ✅ LIVE TIMER (elke seconde refresh UI)
setInterval(() => {
  const lis = document.querySelectorAll("#queueList li");
  lis.forEach(li => {
    // force re-render via text refresh
    li.style.opacity = "0.99";
  });
}, 1000);

</script>
</body>
</html>
