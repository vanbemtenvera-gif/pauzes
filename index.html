
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 20px auto;
}
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.active { color: red; font-weight: bold; }
.notice { color: green; font-weight: bold; }
button { margin-left: 5px; }
#errorBox {
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: #ffebee;
  border: 1px solid red;
  padding: 10px;
  z-index: 9999;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle"> Admin modus
</label>

<div id="adminControls" style="display:none;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 1</span>
  <button id="increaseSlot">+</button>
</div>

<p id="activeInfo"></p>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<div id="errorBox"></div>

<script type="module" src="app.js"></script>
</body>
</html>
