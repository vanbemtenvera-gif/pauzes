
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice { color: green; font-weight: bold; font-size: 18px; }
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin / Superadmin
</label>

<div id="slotControls" style="display:none; margin-top:10px;">
  <button id="minusSlot">-</button>
  <span id="slotInfo">Extra slots: 0</span>
  <button id="plusSlot">+</button>
</div>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");

// Rollen
const ADMIN_PASSWORD = "admin123";
const SUPERADMIN_PASSWORD = "super123";

let isAdmin = false;
let isSuperAdmin = false;

// Slots
let extraSlots = 0;

// State
let currentDocId = null;
let lastItems = [];
let lastMe = null;
let lastPosition = null;

// ✅ NOTIFICATIES
if ("Notification" in window) {
  Notification.requestPermission().catch(() => {});
}

function showNotification() {
  if (Notification.permission === "granted") {
    new Notification("👉 JOUW BEURT!", {
      body: "Je mag starten!"
    });
  }

  const original = document.title;
  const interval = setInterval(() => {
    document.title =
      document.title === "👉 JOUW BEURT!" ? original : "👉 JOUW BEURT!";
  }, 1000);

  setTimeout(() => {
    clearInterval(interval);
    document.title = original;
  }, 15000);
}

// Client ID
let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

// UI
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const adminToggle = document.getElementById("adminToggle");
const notice = document.getElementById("notice");
const slotControls = document.getElementById("slotControls");
const slotInfo = document.getElementById("slotInfo");

// Timer
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;
}

// Admin login
adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Wachtwoord:");

    if (input === SUPERADMIN_PASSWORD) {
      isSuperAdmin = true;
      isAdmin = true;
      slotControls.style.display = "block";

    } else if (input === ADMIN_PASSWORD) {
      isAdmin = true;
      slotControls.style.display = "block";

    } else {
      alert("Fout ❌");
      adminToggle.checked = false;
      return;
    }
  } else {
    isAdmin = false;
    isSuperAdmin = false;
    slotControls.style.display = "none";
  }
});

// Slots knoppen
document.getElementById("plusSlot").onclick = () => {
  extraSlots++;
  slotInfo.textContent = `Extra slots: ${extraSlots}`;
};

document.getElementById("minusSlot").onclick = () => {
  if (extraSlots > 0) {
    extraSlots--;
    slotInfo.textContent = `Extra slots: ${extraSlots}`;
  }
};

// JOIN
joinBtn.addEventListener("click", async () => {
  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting",
    joinedAt: Date.now()
  });
});

// LEAVE
leaveBtn.addEventListener("click", async () => {
  if (!currentDocId) return;
  await deleteDoc(doc(db, "queue", currentDocId));
});

// REALTIME
onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const data = d.data();

    if (data.clientId === clientId) {
      currentDocId = d.id;
      me = { id: d.id, ...data };
    }

    items.push({ id: d.id, ...data });
  });

  lastItems = items;
  lastMe = me;

  render(items, me);
});

// RENDER
function render(items, me) {

  queueList.innerHTML = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");
    const elapsed = item.joinedAt ? Date.now() - item.joinedAt : 0;

    li.textContent = `${i+1}. ${item.name} (${formatTime(elapsed)})`;

    if (item.status === "active") li.textContent += " (bezig)";
    if (item.id === currentDocId) li.classList.add("me");

    if (item.id === currentDocId) {

      if (i < (2 + extraSlots)) {
        const start = document.createElement("button");
        start.textContent = "Start";

        start.onclick = () =>
          updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now()
          });

        li.appendChild(start);
      }

      const stop = document.createElement("button");
      stop.textContent = "Stop";
      stop.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));
      li.appendChild(stop);

      const back = document.createElement("button");
      back.textContent = "⬇ Later";

      if (i < items.length - 1 && item.status !== "active") {
        back.onclick = () => moveBackOne(item, items, i);
      } else {
        back.disabled = true;
      }

      li.appendChild(back);
    }

    if (isAdmin) {
      const del = document.createElement("button");
      del.textContent = "❌";
      del.onclick = () => deleteDoc(doc(db, "queue", item.id));
      li.appendChild(del);
    }

    if (isSuperAdmin) {

      if (i > 0) {
        const up = document.createElement("button");
        up.textContent = "⬆";
        up.onclick = () => moveUp(item, items, i);
        li.appendChild(up);
      }

      if (i < items.length - 1) {
        const down = document.createElement("button");
        down.textContent = "⬇";
        down.onclick = () => moveDown(item, items, i);
        li.appendChild(down);
      }
    }

    queueList.appendChild(li);
  });

  // STATUS + NOTIFICATIE
  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notice.textContent = "";
    lastPosition = null;
  } else {
    const idx = items.findIndex(x => x.id === me.id);
    yourStatus.textContent = `Positie: ${idx+1}`;

    const isTop = idx < (2 + extraSlots);

    if (isTop && me.status !== "active") {
      notice.textContent = "👉 JE BENT AAN DE BEURT!";
    }

    // ✅ NOTIFICATIE TRIGGER
    if (isTop && lastPosition !== idx && me.status !== "active") {
      showNotification();
    }

    lastPosition = idx;
  }
}

// ✅ SWAP (FIX)
async function moveBackOne(item, items, index) {
  if (index >= items.length - 1) return;

  const next = items[index + 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: next.position
  });

  await updateDoc(doc(db, "queue", next.id), {
    position: item.position
  });
}

async function moveUp(item, items, index) {
  const prev = items[index - 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: prev.position
  });

  await updateDoc(doc(db, "queue", prev.id), {
    position: item.position
  });
}

async function moveDown(item, items, index) {
  const next = items[index + 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: next.position
  });

  await updateDoc(doc(db, "queue", next.id), {
    position: item.position
  });
}

// refresh
setInterval(() => {
  if (lastItems.length > 0) {
    render(lastItems, lastMe);
  }
}, 1000);

</script>
</body>
</html>
