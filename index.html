
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 0;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

.container {
  position: relative;
  max-width: 700px;
  margin: 40px auto;
  background: rgba(255,255,255,0.9);
  padding: 25px;
  border-radius: 20px;
}

li {
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
}

.me {
  background: #e3f2fd;
}

.active {
  background: #e8f5e9;
  border: 2px solid #4caf50;
}

.notice { text-align:center; font-weight:bold; color:green; }
</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
});

const db = getFirestore(app);
const queueCol = collection(db, "queue");

let lastItems = [];
let lastMe = null;
let maxSlots = 2;
let lastWasTop = false;

const beep = new Audio("https://archive.org/download/iphone_notification/iphone_notification.mp3");

if ("Notification" in window) {
  Notification.requestPermission().catch(()=>{});
}

function showNotification(){
  beep.currentTime = 0;
  beep.play().catch(()=>{});

  if(Notification.permission==="granted"){
    new Notification("👉 JOUW BEURT!", {body:"Je mag starten!"});
  }
}

let clientId = localStorage.getItem("clientId") || ("c_"+Math.random());
localStorage.setItem("clientId", clientId);

// ✅ FIX: correcte volgorde join
joinBtn.onclick = async () => {
  let newPosition = Date.now();

  if (lastItems.length > 0) {
    const maxPos = Math.max(...lastItems.map(i => i.position));
    newPosition = maxPos + 1;
  }

  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: newPosition,
    status: "waiting"
  });
};

leaveBtn.onclick = async () => {
  const me = lastItems.find(x => x.clientId === clientId);
  if (!me) return;
  await deleteDoc(doc(db,"queue",me.id));
};

onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d=>{
    const data = d.data();
    if(data.clientId===clientId){
      me = {id:d.id,...data};
    }
    items.push({id:d.id,...data});
  });

  lastItems = items;
  lastMe = me;

  render(items,me);
});

function render(items,me){

  queueList.innerHTML="";

  items.forEach((item,i)=>{

    const li = document.createElement("li");
    li.textContent = `${i+1}. ${item.name}`;

    if(item.id===me?.id) li.classList.add("me");
    if(item.status==="active") li.classList.add("active");

    if(item.id===me?.id){

      if(i<maxSlots){
        const start=document.createElement("button");
        start.textContent="Start";
        start.onclick=()=>updateDoc(doc(db,"queue",item.id),{status:"active"});
        li.appendChild(start);
      }

      const stop=document.createElement("button");
      stop.textContent="Stop";
      stop.onclick=()=>deleteDoc(doc(db,"queue",item.id));
      li.appendChild(stop);
    }

    queueList.appendChild(li);
  });

  if(!me){
    yourStatus.textContent="Niet in wachtrij";
    return;
  }

  const idx = items.findIndex(x=>x.id===me.id);
  const isTop = idx < maxSlots;

  if(me.status==="active"){
    notice.textContent="";
    lastWasTop=false;
    return;
  }

  notice.textContent = isTop ? "👉 JE BENT AAN DE BEURT!" : "";

  if(isTop && !lastWasTop){
    showNotification();
  }

  lastWasTop = isTop;
}
</script>

</body>
</html>
