
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 20px auto;
}
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice {
  color: green;
  font-weight: bold;
  font-size: 18px;
}
button { margin-left: 5px; }

</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin modus
</label>

<div id="adminControls" style="display:none;margin-top:10px;">
  <button id="decreaseSlot">-</button>
  <span id="slotCount">Slots: 2</span>
  <button id="increaseSlot">+</button>
</div>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
/* ✅ FIX: quotes toegevoegd */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_HIER_JE_API_KEY",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let currentDocId = null;
let lastItems = [];
let lastMe = null;
let isAdmin = false;
let notified = false;
let slots = 2;

//////////////////////////////
// 🔊 AUDIO
//////////////////////////////

/* ✅ FIX: quotes toegevoegd */
const alertSound = new Audio(
  "https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3"
);

alertSound.volume = 1.0;
let soundEnabled = false;

document.addEventListener("click", () => {
  if (!soundEnabled) {
    alertSound.play().then(() => {
      alertSound.pause();
      alertSound.currentTime = 0;
      soundEnabled = true;
    }).catch(()=>{});
  }
});

//////////////////////////////
// 🔔 NOTIFICATIE
//////////////////////////////

if ("Notification" in window) {
  Notification.requestPermission().catch(()=>{});
}

function showNotification() {
  if (Notification.permission === "granted") {
    new Notification("👉 JOUW BEURT!", {
      body: "Je bent aan de beurt!"
    });
  }

  if (soundEnabled) {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
  }

  const original = document.title;
  const interval = setInterval(() => {
    document.title =
      document.title === "👉 JOUW BEURT!"
        ? original
        : "👉 JOUW BEURT!";
  }, 1000);

  setTimeout(() => {
    clearInterval(interval);
    document.title = original;
  }, 15000);
}

//////////////////////////////
// CLIENT ID
//////////////////////////////

let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

//////////////////////////////
// UI
//////////////////////////////

const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const notice = document.getElementById("notice");
const adminToggle = document.getElementById("adminToggle");

const adminControls = document.getElementById("adminControls");
const slotCount = document.getElementById("slotCount");
const increaseSlot = document.getElementById("increaseSlot");
const decreaseSlot = document.getElementById("decreaseSlot");

//////////////////////////////
// HELPERS
//////////////////////////////

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

//////////////////////////////
// ADMIN
//////////////////////////////

const ADMIN_PASSWORD = "admin123";

adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Admin wachtwoord:");
    if (input === ADMIN_PASSWORD) {
      isAdmin = true;
      adminControls.style.display = "block";
    } else {
      adminToggle.checked = false;
    }
  } else {
    isAdmin = false;
    adminControls.style.display = "none";
  }
});

increaseSlot.onclick = async () => {
  if (!isAdmin) return;
  await setDoc(configDoc, { slots: slots + 1 });
};

decreaseSlot.onclick = async () => {
  if (!isAdmin || slots <= 1) return;
  await setDoc(configDoc, { slots: slots - 1 });
};

onSnapshot(configDoc, snap => {
  if (snap.exists()) {
    slots = snap.data().slots || 2;
  }
  slotCount.textContent = `Slots: ${slots}`;
});

//////////////////////////////
// 🔼🔽 ADMIN MOVE
//////////////////////////////

async function moveUp(item, items, index) {
  if (index === 0) return;
  const prev = items[index - 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: prev.position - 0.1
  });
}

async function moveDown(item, items, index) {
  if (index === items.length - 1) return;
  const next = items[index + 1];

  await updateDoc(doc(db, "queue", item.id), {
    position: next.position + 0.1
  });
}

// JOIN
//////////////////////////////
