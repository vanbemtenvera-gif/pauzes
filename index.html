
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 0;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

.container {
  position: relative;
  max-width: 700px;
  margin: 40px auto;
  background: rgba(255,255,255,0.9);
  padding: 25px;
  border-radius: 20px;
}

li {
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
}

.me {
  background: #e3f2fd;
  border: 2px solid #1976d2;
}

.active {
  background: #e8f5e9 !important;
  border: 2px solid #4caf50;
}

.notice {
  text-align: center;
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<div class="container">

<h1>Virtuele wachtrij</h1>

<input id="nameInput">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label><input type="checkbox" id="adminToggle"> Admin</label>

<div id="slotControls" style="display:none;">
  <button id="minusSlot">-</button>
  <span id="slotInfo">Slots: 2</span>
  <button id="plusSlot">+</button>
</div>

<ul id="queueList"></ul>

<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const today = new Date().toISOString().slice(0,10).replace(/-/g,"");

document.body.style.backgroundImage =
`linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
url("https://picsum.photos/seed/${today}/1600/900")`;

// Firebase
const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
});

const db = getFirestore(app);
const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

let maxSlots = 2;
let lastWasTop = false;

const beep = new Audio("https://archive.org/download/iphone_notification/iphone_notification.mp3");

function showNotification() {
  beep.currentTime = 0;
  beep.play().catch(()=>{});
}

// client id
let clientId = localStorage.getItem("clientId") || ("c_" + Math.random());
localStorage.setItem("clientId", clientId);

// slots realtime
onSnapshot(configDoc, async snap => {
  if (snap.exists()) {
    maxSlots = snap.data().maxSlots ?? 2;
  } else {
    await setDoc(configDoc, { maxSlots: 2 });
  }
});

// JOIN
joinBtn.onclick = async () => {
  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),
    status: "waiting"
  });
};

// REALTIME
onSnapshot(query(queueCol, orderBy("position")), snap => {

  const items = [];
  let me = null;

  snap.forEach(d => {
    const data = d.data();
    if (data.clientId === clientId) me = { id: d.id, ...data };
    items.push({ id: d.id, ...data });
  });

  render(items, me);
});

// ✅ RENDER
function render(items, me) {

  queueList.innerHTML = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");

    if (item.id === me?.id) li.classList.add("me");
    if (item.status === "active") li.classList.add("active");

    li.textContent = `${i+1}. ${item.name}`;

    if (item.id === me?.id) {

      // ✅ START
      if (i < maxSlots) {
        const start = document.createElement("button");
        start.textContent = "Start";
        start.onclick = () =>
          updateDoc(doc(db,"queue",item.id), { status:"active" });
        li.appendChild(start);
      }

      // ✅ STOP
      const stop = document.createElement("button");
      stop.textContent = "Stop";
      stop.onclick = () => deleteDoc(doc(db,"queue",item.id));
      li.appendChild(stop);
    }

    queueList.appendChild(li);
  });

  // ✅ STATUS FIX
  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notice.textContent = "";
    lastWasTop = false;
    return;
  }

  const idx = items.findIndex(x => x.id === me.id);
  const isTop = idx < maxSlots;

  // ✅ 🔥 NIEUW: als actief → alles resetten
  if (me.status === "active") {
    notice.textContent = "";
    lastWasTop = false;
    return;
  }

  // normaal gedrag
  notice.textContent = isTop ? "👉 JE BENT AAN DE BEURT!" : "";

  if (isTop && !lastWasTop) {
    showNotification();
  }

  lastWasTop = isTop;
}
</script>

</body>
</html>
