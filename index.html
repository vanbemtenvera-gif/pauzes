
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Virtuele wachtrij</title>

<style>
body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
li { margin: 6px 0; }
.me { background: #e3f2fd; }
.notice { color: green; font-weight: bold; font-size: 18px; }
button { margin-left: 5px; }
</style>
</head>

<body>

<h1>Virtuele wachtrij</h1>

<input id="nameInput" placeholder="Jouw naam">
<button id="joinBtn">Join</button>
<button id="leaveBtn">Leave</button>

<br><br>

<label>
  <input type="checkbox" id="adminToggle">
  Admin
</label>

<div id="adminControls" style="display:none; margin-top:10px;">
  <button id="slotMinus">-</button>
  <span id="slotDisplay">Slots: 2</span>
  <button id="slotPlus">+</button>
</div>

<ul id="queueList"></ul>
<p id="yourStatus"></p>
<p id="notice" class="notice"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, updateDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "adem-in---adem-uit.firebaseapp.com",
  projectId: "adem-in---adem-uit"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const queueCol = collection(db, "queue");
const configDoc = doc(db, "config", "settings");

// State
let currentDocId = null;
let lastItems = [];
let lastMe = null;
let lastPosition = null;
let maxActiveSlots = 2;
let isAdmin = false;

// UI
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const leaveBtn = document.getElementById("leaveBtn");
const queueList = document.getElementById("queueList");
const yourStatus = document.getElementById("yourStatus");
const adminToggle = document.getElementById("adminToggle");
const notice = document.getElementById("notice");
const adminControls = document.getElementById("adminControls");
const slotDisplay = document.getElementById("slotDisplay");

// Timer
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;
}

// Client ID
let clientId = localStorage.getItem("clientId");
if (!clientId) {
  clientId = "client_" + Math.random().toString(36).slice(2);
  localStorage.setItem("clientId", clientId);
}

// Admin
adminToggle.addEventListener("change", () => {
  if (adminToggle.checked) {
    const input = prompt("Wachtwoord:");
    if (input === "admin123") {
      isAdmin = true;
      adminControls.style.display = "block";
    } else {
      alert("Fout ❌");
      adminToggle.checked = false;
    }
  } else {
    isAdmin = false;
    adminControls.style.display = "none";
  }
});

// Config
onSnapshot(configDoc, async (snap) => {
  if (snap.exists()) {
    maxActiveSlots = snap.data().maxActiveSlots ?? 2;
  } else {
    await setDoc(configDoc, { maxActiveSlots: 2 });
  }
  slotDisplay.textContent = `Slots: ${maxActiveSlots}`;
});

// Slot knoppen
document.getElementById("slotPlus").onclick = async () => {
  await setDoc(configDoc, {
    maxActiveSlots: maxActiveSlots + 1
  }, { merge: true });
};

document.getElementById("slotMinus").onclick = async () => {
  if (maxActiveSlots > 1) {
    await setDoc(configDoc, {
      maxActiveSlots: maxActiveSlots - 1
    }, { merge: true });
  }
};

// JOIN
joinBtn.addEventListener("click", async () => {
  await addDoc(queueCol, {
    clientId,
    name: nameInput.value || "Anoniem",
    position: Date.now(),   // blijft
    joinedAt: Date.now(),   // fallback
    status: "waiting"
  });
});

// LEAVE
leaveBtn.addEventListener("click", async () => {
  if (!currentDocId) return;
  await deleteDoc(doc(db, "queue", currentDocId));
});

// ✅ 🔥 BELANGRIJK: GEEN WRITES HIER MEER
onSnapshot(query(queueCol, orderBy("position", "asc")), snap => {

  let items = [];
  let me = null;

  snap.forEach(d => {
    const data = d.data();

    if (data.clientId === clientId) {
      currentDocId = d.id;
      me = { id: d.id, ...data };
    }

    items.push({ id: d.id, ...data });
  });

  // ✅ STABIELE SORT (DE FIX)
  items.sort((a, b) => {
    const pa = a.position ?? a.joinedAt ?? Infinity;
    const pb = b.position ?? b.joinedAt ?? Infinity;
    return pa - pb;
  });

  lastItems = items;
  lastMe = me;

  render(items, me);
});

// RENDER
function render(items, me) {

  queueList.innerHTML = "";

  items.forEach((item, i) => {

    const li = document.createElement("li");

    const elapsed = item.joinedAt ? Date.now() - item.joinedAt : 0;
    li.textContent = `${i+1}. ${item.name} (${formatTime(elapsed)})`;

    if (item.status === "active") li.textContent += " (bezig)";
    if (item.id === currentDocId) li.classList.add("me");

    if (item.id === currentDocId) {

      if (i < maxActiveSlots) {
        const start = document.createElement("button");
        start.textContent = "Start";
        start.onclick = () =>
          updateDoc(doc(db, "queue", item.id), {
            status: "active",
            joinedAt: Date.now()
          });
        li.appendChild(start);
      }

      const stop = document.createElement("button");
      stop.textContent = "Stop";
      stop.onclick = () =>
        deleteDoc(doc(db, "queue", item.id));
      li.appendChild(stop);
    }

    if (isAdmin) {
      const del = document.createElement("button");
      del.textContent = "❌";
      del.onclick = () => deleteDoc(doc(db, "queue", item.id));
      li.appendChild(del);
    }

    queueList.appendChild(li);
  });

  // STATUS
  if (!me) {
    yourStatus.textContent = "Niet in wachtrij";
    notice.textContent = "";
    lastPosition = null;
  } else {
    const idx = items.findIndex(x => x.id === me.id);
    yourStatus.textContent = `Positie: ${idx+1}`;

    const isTop = idx < maxActiveSlots;

    if (isTop && lastPosition !== idx) {
      notice.textContent = "👉 JE BENT AAN DE BEURT!";
    } else {
      notice.textContent = "";
    }

    lastPosition = idx;
  }
}

// refresh
setInterval(() => {
  if (lastItems.length > 0) {
    render(lastItems, lastMe);
  }
}, 1000);

</script>
</body>
</html>
